[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinescript-chatterbox"
version = "0.1.1"
description = "Chatterbox voices for kine voice: laughs and sighs from tags, cloned voices, and the time of each word"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dr. Know How" }]
requires-python = ">=3.10"
# Chatterbox's watermarker (resemble-perth) imports pkg_resources, which setuptools 82 removed.
dependencies = ["chatterbox-tts>=0.1.7", "setuptools<82"]
keywords = ["kinescript", "chatterbox", "text to speech", "tts", "voice-over", "forced alignment", "voice cloning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

# Same rule as the main package: trusted publishing from drknowhow/kinescript marks a link verified only under
# https://github.com/drknowhow/kinescript or https://drknowhow.github.io/kinescript.
[project.urls]
Homepage = "https://github.com/drknowhow/kinescript/tree/main/plugins/kinescript-chatterbox"
Documentation = "https://drknowhow.github.io/kinescript/"
Source = "https://github.com/drknowhow/kinescript/tree/main/plugins/kinescript-chatterbox"
Issues = "https://github.com/drknowhow/kinescript/issues"
Changelog = "https://github.com/drknowhow/kinescript/blob/main/CHANGELOG.md"

[project.entry-points."kinescript.voice"]
chatterbox = "kinescript_chatterbox:synth"

[tool.setuptools]
packages = ["kinescript_chatterbox"]
