[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinescript"
version = "1.2.0"
description = "Render motion graphics, video edits and voice-over from JSON scenes on the GPU, with checks an agent can read."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "kinescript/fonts/*-OFL.txt"]
authors = [{ name = "Dr. Know How" }]
requires-python = ">=3.10"
dependencies = ["skia-python>=87", "numpy>=1.24", "glfw>=2.5"]
keywords = [
    "video", "video rendering", "video editing", "programmatic video", "motion graphics", "animation",
    "json", "skia", "gpu", "ffmpeg", "3d", "captions", "voice-over", "text to speech", "audio mixing",
    "loudness", "mcp", "ai agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

# PyPI shows these as the "Project links" sidebar and gives each label an icon. Trusted publishing
# marks a URL verified when it sits under https://github.com/<owner>/<repo> or
# https://<owner>.github.io/<repo>, so keep every link on one of those two.
[project.urls]
Homepage = "https://drknowhow.github.io/kinescript/"
Documentation = "https://drknowhow.github.io/kinescript/"
Source = "https://github.com/drknowhow/kinescript"
Issues = "https://github.com/drknowhow/kinescript/issues"
Changelog = "https://github.com/drknowhow/kinescript/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1.2",
    "readme_renderer[md]>=43",   # renders README.md the way PyPI does (tests/test_packaging.py)
    "trove-classifiers",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
kine = "kinescript.cli:main"

[tool.setuptools]
packages = ["kinescript", "kinescript.fonts"]  # fonts/ is a data-only package

[tool.setuptools.package-data]
"kinescript.fonts" = ["*.ttf", "*.txt"]
