name: pages

# Publishes site/ as it is in the repository to GitHub Pages: https://drknowhow.github.io/kinescript/
# The site has no build step. Its videos, posters and the JSON and score fragments in index.html are made
# locally with `python marketing/build_site.py` and committed. Pages must be set to deploy from GitHub Actions
# (Settings > Pages > Source) before the first run.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in progress instead of cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
