name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libegl1 libfontconfig1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Sample media (gitignored; examples and promo need it)
        run: python examples/make_media.py
      - name: Test (CPU backend; runners have no GPU)
        env:
          KINE_BACKEND: cpu
        run: pytest -q
      - name: Build
        run: python -m build && pip install twine && twine check dist/*
